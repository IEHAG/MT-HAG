<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Video Escolar</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .video-container {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      width: 80%;
      max-width: 800px;
      margin-bottom: 20px;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
    }
    .controls {
      background-color: #eee;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .controls button {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .controls button:hover {
      background-color: #0056b3;
    }
    .controls input[type=range] {
      width: 60%;
    }
    /* Botón para volver */
    .back-button {
      background-color: #28a745;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
      margin-top: 10px;
    }
    .back-button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <!-- Si lo deseas, agrega un poster para mostrar imagen previa -->
    <video id="myVideo" controls poster="poster.jpg" playsinline>
      <source src="./2PREPRENSADIGITAL.mp4" type="video/mp4">
      Tu navegador no soporta la reproducción de video.
    </video>
    <div class="controls">
      <button id="playPauseBtn">Play</button>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
    </div>
  </div>
  
  <!-- Botón para volver a la página anterior -->
  <button onclick="window.history.back()" class="back-button">Volver a la Página Anterior</button>
  
  <script>
    const video = document.getElementById('myVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const volumeSlider = document.getElementById('volumeSlider');
  
    playPauseBtn.addEventListener('click', function() {
      if (video.paused) {
        video.play();
        playPauseBtn.textContent = 'Pause';
      } else {
        video.pause();
        playPauseBtn.textContent = 'Play';
      }
    });
  
    volumeSlider.addEventListener('input', function() {
      video.volume = volumeSlider.value;
    });
  </script>
</body>
</html>
