    <script>
    function togglePlanSubmenu(event) {
      event.stopPropagation()
      event.preventDefault()
      var btn = document.getElementById('planEstudioBtn')
      var submenu = document.getElementById('submenu')
      if (!btn || !submenu) return
      var isOpen = !submenu.classList.contains('hidden')
      document.querySelectorAll('.submenu:not(.hidden)').forEach(function(s) { s.classList.add('hidden') })
      if (isOpen) return
      var rect = btn.getBoundingClientRect()
      submenu.style.position = 'fixed'
      submenu.style.top = (rect.bottom + 6) + 'px'
      submenu.style.left = Math.max(8, rect.left) + 'px'
      submenu.style.minWidth = Math.max(rect.width, 260) + 'px'
      submenu.classList.remove('hidden')
    }
    document.addEventListener('click', function(event) {
      var submenu = document.getElementById('submenu')
      if (!submenu) return
      if (!submenu.contains(event.target) && event.target.id !== 'planEstudioBtn' && !event.target.closest('#planEstudioBtn')) {
        submenu.classList.add('hidden')
      }
    })
    </script>
