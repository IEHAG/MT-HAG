<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planes de Mejoramiento - Media Técnica HAG</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        body { padding: 140px 40px 100px; background: transparent; }

        .back-to-main {
            position: fixed; top: 16px; left: 20px; z-index: 110;
        }

        .back-to-main a {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 18px; background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px; color: var(--white); font-weight: 500;
            font-size: 0.85rem; text-decoration: none; transition: var(--transition);
            font-family: var(--font);
        }

        .back-to-main a:hover {
            background: rgba(255,255,255,0.25); transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .page-header {
            text-align: center; margin-bottom: 32px; position: relative; z-index: 2;
        }

        .page-header h1 {
            font-size: 2rem; font-weight: 800; color: var(--primary);
            letter-spacing: -0.5px; margin-bottom: 6px;
        }

        .page-header p { color: var(--text-light); font-size: 0.95rem; }

        .planes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
            max-width: 1100px;
            margin: 0 auto;
            position: relative; z-index: 2;
        }

        .plan-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.04);
            transition: var(--transition);
        }

        .plan-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .plan-card-header {
            display: flex; align-items: center; gap: 14px;
            padding: 20px 24px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }

        .plan-badge {
            width: 48px; height: 48px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; flex-shrink: 0;
        }

        .plan-badge.prog { background: linear-gradient(135deg, #003366, #004d99); }
        .plan-badge.prep { background: linear-gradient(135deg, #6a00f4, #b5179e); }

        .plan-card-header h3 {
            font-size: 1rem; font-weight: 700; color: var(--primary);
        }

        .plan-card-header .plan-subject {
            font-size: 0.82rem; color: var(--text-light); margin-top: 2px;
        }

        .plan-card-body { padding: 16px 24px 20px; }

        .plan-activities-title {
            font-size: 0.78rem; font-weight: 600; color: var(--text-light);
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
        }

        .plan-activity {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; margin-bottom: 8px;
            background: rgba(0,0,0,0.02);
            border-radius: 10px;
            font-size: 0.88rem; color: var(--primary);
            transition: var(--transition);
        }

        .plan-activity:last-child { margin-bottom: 0; }
        .plan-activity:hover { background: rgba(0,102,204,0.04); }

        .plan-activity .check {
            width: 22px; height: 22px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .plan-card-footer {
            padding: 0 24px 20px;
        }

        .plan-card-footer a {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--accent), #008833);
            color: #fff; text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 600; font-size: 0.85rem;
            transition: var(--transition);
        }

        .plan-card-footer a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,170,68,0.3);
        }

        @media (max-width: 780px) {
            body { padding: 120px 16px 80px; }
            .page-header h1 { font-size: 1.4rem; }
            .planes-grid { grid-template-columns: 1fr; }
            .back-to-main { top: 10px; left: 10px; }
            .back-to-main a { padding: 8px 14px; font-size: 0.75rem; }
        }

        @media (max-width: 480px) {
            body { padding: 110px 12px 80px; }
            .page-header h1 { font-size: 1.2rem; }
        }

        @media (prefers-color-scheme: dark) {
            .plan-card { background: rgba(255,255,255,0.04); }
            .plan-card:hover { border-color: rgba(0,102,204,0.2); }
            .plan-card-header h3 { color: var(--text); }
            .plan-activity { background: rgba(255,255,255,0.03); color: var(--text); }
            .plan-activity:hover { background: rgba(255,255,255,0.06); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <canvas id="galaxy-canvas" aria-hidden="true"></canvas>

    <div class="back-to-main">
        <a href="../index.html"><i class="fas fa-arrow-left"></i> Volver</a>
    </div>

    <div class="page-header">
        <h1><i class="fas fa-tasks" style="color:var(--accent-red);margin-right:10px;"></i>Planes de Mejoramiento</h1>
        <p>Actividades de recuperación académica por grado</p>
    </div>

    <div class="planes-grid" id="planes"></div>

    <footer>
        <div class="footer-content">
            <span>&copy; 2025 I.E. Héctor Abad Gómez</span>
            <span class="footer-sep">|</span>
            <span>Desarrollado por Docente Victor Cañola</span>
        </div>
    </footer>

    <script src="../js/planes.js"></script>
    <script type="module" src="../src/js/galaxy.js"></script>
</body>
</html>
