<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Video Escolar</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .video-container {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      width: 80%;
      max-width: 800px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    iframe {
      width: 100%;
      height: 450px;
      border: none;
    }
    /* Botón para volver */
    .back-button {
      background-color: #28a745;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
      margin-top: 10px;
    }
    .back-button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <!-- Iframe de Google Drive -->
    <iframe src="https://drive.google.com/file/d/1l4dLmDlmiMw7LZ5XBuZ_kdNOVKIS9_6c/preview" allow="autoplay" allowfullscreen></iframe>
  </div>
  
  <!-- Botón para volver a la página anterior -->
  <button onclick="window.history.back()" class="back-button">Volver a la Página Anterior</button>

</body>
</html>
