<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario de Clases - Media Técnica HAG</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        body { padding: 140px 40px 100px; background: transparent; }

        .back-to-main {
            position: fixed; top: 16px; left: 20px; z-index: 110;
        }

        .back-to-main a {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 18px; background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px; color: var(--white); font-weight: 500;
            font-size: 0.85rem; text-decoration: none; transition: var(--transition);
            font-family: var(--font);
        }

        .back-to-main a:hover {
            background: rgba(255,255,255,0.25); transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .page-header {
            text-align: center; margin-bottom: 32px; position: relative; z-index: 2;
        }

        .page-header h1 {
            font-size: 2rem; font-weight: 800; color: var(--primary);
            letter-spacing: -0.5px; margin-bottom: 6px;
        }

        .page-header p { color: var(--text-light); font-size: 0.95rem; }

        .schedule-toolbar {
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr auto;
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto 16px;
            position: relative; z-index: 2;
            align-items: end;
        }

        .schedule-toolbar label {
            display: block; font-size: 0.78rem; font-weight: 600;
            color: var(--primary); margin-bottom: 6px;
        }

        .schedule-toolbar select,
        .schedule-toolbar input {
            width: 100%; padding: 10px 14px;
            background: #fff; border: 1px solid rgba(0,0,0,0.12);
            border-radius: var(--radius-sm); font-family: var(--font);
            font-size: 0.85rem; color: #1a1a2e;
            transition: var(--transition); outline: none;
        }

        .schedule-toolbar select:focus,
        .schedule-toolbar input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }

        .toolbar-actions { display: flex; gap: 8px; }

        .toolbar-actions button {
            padding: 10px 18px; border: none; border-radius: var(--radius-sm);
            font-family: var(--font); font-weight: 600; font-size: 0.82rem;
            cursor: pointer; transition: var(--transition);
        }

        .btn-clear {
            background: var(--light-gray, #f1f5f9); color: var(--primary);
        }

        .btn-clear:hover { background: #e2e8f0; }

        .btn-print {
            background: var(--primary); color: var(--white);
        }

        .btn-print:hover { background: var(--secondary); transform: translateY(-1px); }

        .schedule-legend {
            display: flex; gap: 16px; justify-content: center;
            margin-bottom: 24px; position: relative; z-index: 2;
            flex-wrap: wrap;
        }

        .legend-item {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 0.8rem; color: var(--text-light); font-weight: 500;
        }

        .legend-dot {
            width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0;
        }

        .schedule-grid {
            max-width: 1100px; margin: 0 auto; position: relative; z-index: 2;
            display: flex; flex-direction: column; gap: 20px;
        }

        .schedule-card {
            background: var(--white); border-radius: var(--radius);
            box-shadow: var(--shadow-sm); overflow: hidden;
            border: 1px solid rgba(0,0,0,0.04);
            transition: var(--transition);
        }

        .schedule-card:hover { box-shadow: var(--shadow-md); }

        .schedule-card-header {
            display: flex; align-items: center; gap: 12px;
            padding: 18px 24px;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }

        .schedule-card-header .grade-badge {
            display: flex; align-items: center; justify-content: center;
            width: 42px; height: 42px; border-radius: 12px;
            font-weight: 800; font-size: 1rem; color: #fff; flex-shrink: 0;
        }

        .schedule-card-header h3 {
            font-size: 1.05rem; font-weight: 700; color: var(--primary);
        }

        .schedule-card-body { padding: 0; }

        .schedule-row {
            display: grid;
            grid-template-columns: 100px 140px 1fr 80px;
            align-items: center;
            padding: 14px 24px;
            border-bottom: 1px solid rgba(0,0,0,0.03);
            transition: var(--transition);
        }

        .schedule-row:last-child { border-bottom: none; }
        .schedule-row:hover { background: rgba(0,0,0,0.015); }

        .schedule-row .day-name {
            font-weight: 700; font-size: 0.88rem; color: var(--primary);
        }

        .schedule-row .time-range {
            font-size: 0.78rem; color: var(--text-light);
            display: flex; align-items: center; gap: 6px;
        }

        .schedule-row .subject-name {
            font-size: 0.85rem; color: var(--primary); font-weight: 500;
        }

        .schedule-row .subject-tag {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 0.7rem; font-weight: 600; text-align: center;
            white-space: nowrap;
        }

        @media (max-width: 780px) {
            body { padding: 120px 16px 80px; }
            .page-header h1 { font-size: 1.4rem; }
            .schedule-toolbar { grid-template-columns: 1fr 1fr; }
            .toolbar-actions { grid-column: 1 / -1; }
            .schedule-row { grid-template-columns: 1fr; gap: 4px; padding: 14px 18px; }
            .back-to-main { top: 10px; left: 10px; }
            .back-to-main a { padding: 8px 14px; font-size: 0.75rem; }
        }

        @media (max-width: 480px) {
            body { padding: 110px 12px 80px; }
            .page-header h1 { font-size: 1.2rem; }
            .schedule-toolbar { grid-template-columns: 1fr; }
        }

        @media print {
            body { background: #fff !important; padding: 20px; }
            .back-to-main, .schedule-toolbar, .schedule-legend, footer, #galaxy-canvas { display: none !important; }
            .schedule-card { break-inside: avoid; border: 1px solid #ddd; }
            .schedule-row { border-color: #eee; }
        }

        @media (prefers-color-scheme: dark) {
            .schedule-card { background: rgba(255,255,255,0.04); }
            .schedule-card:hover { border-color: rgba(0,102,204,0.2); }
            .schedule-row:hover { background: rgba(255,255,255,0.03); }
            .schedule-card-header h3 { color: var(--text); }
            .schedule-row .day-name { color: var(--text); }
            .schedule-row .subject-name { color: var(--text); }
            .schedule-toolbar select, .schedule-toolbar input {
                background: rgba(30,30,50,0.9); color: #e8ecf0;
                border-color: rgba(255,255,255,0.12);
            }
            .btn-clear { background: rgba(255,255,255,0.08); color: var(--text); }
            .btn-clear:hover { background: rgba(255,255,255,0.12); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <canvas id="galaxy-canvas" aria-hidden="true"></canvas>

    <div class="back-to-main">
        <a href="../index.html"><i class="fas fa-arrow-left"></i> Volver</a>
    </div>

    <div class="page-header">
        <h1><i class="fas fa-calendar-alt" style="color:var(--accent-red);margin-right:10px;"></i>Horario de Clases</h1>
        <p>Media Técnica — I.E. Héctor Abad Gómez</p>
    </div>

    <div class="schedule-toolbar">
        <div>
            <label for="gradeFilter"><i class="fas fa-layer-group"></i> Grado</label>
            <select id="gradeFilter"><option value="">Todos</option></select>
        </div>
        <div>
            <label for="dayFilter"><i class="fas fa-calendar-day"></i> Día</label>
            <select id="dayFilter"><option value="">Todos</option></select>
        </div>
        <div>
            <label for="searchFilter"><i class="fas fa-search"></i> Buscar</label>
            <input id="searchFilter" type="text" placeholder="Materia, instructor...">
        </div>
        <div class="toolbar-actions">
            <button id="resetFilters" class="btn-clear"><i class="fas fa-undo"></i></button>
            <button id="printSchedule" class="btn-print"><i class="fas fa-print"></i> Imprimir</button>
        </div>
    </div>

    <div class="schedule-legend">
        <span class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#003366,#004d99)"></span> Programación</span>
        <span class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#6a00f4,#b5179e)"></span> Preprensa</span>
        <span class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#2d6a4f,#52b788)"></span> Descanso</span>
        <span class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#64748b,#94a3b8)"></span> Trabajo Conjunto</span>
    </div>

    <div class="schedule-grid" id="schedule"></div>

    <footer>
        <div class="footer-content">
            <span>&copy; 2025 I.E. Héctor Abad Gómez</span>
            <span class="footer-sep">|</span>
            <span>Desarrollado por Docente Victor Cañola</span>
        </div>
    </footer>

    <script src="../js/horario.js"></script>
    <script type="module" src="../src/js/galaxy.js"></script>
</body>
</html>
