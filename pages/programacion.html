<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Video de Programación</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .video-container {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      width: 80%;
      max-width: 800px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    iframe {
      width: 100%;
      height: 450px;
      border: none;
    }
    /* Botón para volver */
    .back-button {
      background-color: #28a745;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
      margin-top: 10px;
    }
    .back-button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <!-- Iframe de Google Drive -->
    <iframe src="https://drive.google.com/file/d/1-fi5Vd7NkmEwTK7iYBT6AkAl7Eou8lKb/preview" allow="autoplay" allowfullscreen></iframe>
  </div>
  
  <!-- Botón para volver a la página anterior -->
  <button onclick="window.history.back()" class="back-button">Volver a la Página Anterior</button>
<!-- Chatbot -->
<div class="chatbot-container">
  <button class="chatbot-toggle">💬 Pregúntame sobre programación</button>
  <div class="chatbot-window">
      <div class="chatbot-header">
          <h3>Asistente de Programación</h3>
          <button class="close-btn">×</button>
      </div>
      <div class="chatbot-messages" id="chatMessages"></div>
      <div class="chatbot-input">
          <input type="text" id="chatInput" placeholder="Escribe tu pregunta...">
          <button onclick="sendMessage()">Enviar</button>
      </div>
  </div>
</div>

<style>
/* Estilos del chatbot */
.chatbot-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
}

.chatbot-toggle {
  background: #28a745;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  transition: 0.3s;
}

.chatbot-window {
  display: none;
  width: 350px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  overflow: hidden;
}

.chatbot-header {
  background: #333;
  color: white;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.chatbot-messages {
  height: 300px;
  padding: 10px;
  overflow-y: auto;
  border-bottom: 1px solid #ddd;
}

.chatbot-input {
  display: flex;
  padding: 10px;
  background: #f5f5f5;
}

.chatbot-input input {
  flex: 1;
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
  margin-right: 10px;
}

.message.user { margin: 5px 0; }
.message.bot { 
  margin: 5px 0;
  background: #e9ecef;
  padding: 8px;
  border-radius: 8px;
}

.close-btn {
  background: none;
  border: none;
  color: white;
  font-size: 1.2em;
  cursor: pointer;
}
</style>

<script>
// Funcionalidad del chatbot
document.querySelector('.chatbot-toggle').addEventListener('click', () => {
  document.querySelector('.chatbot-window').style.display = 'block';
  document.querySelector('.chatbot-toggle').style.display = 'none';
});

document.querySelector('.close-btn').addEventListener('click', () => {
  document.querySelector('.chatbot-window').style.display = 'none';
  document.querySelector('.chatbot-toggle').style.display = 'block';
});

const conocimiento = {
  "html": "HTML es el lenguaje de marcado para crear estructuras web. ¿Quieres saber sobre etiquetas específicas?",
  "css": "CSS se usa para dar estilo a páginas web. ¿Necesitas ayuda con selectores, flexbox o grid?",
  "javascript": "JavaScript permite crear interactividad. ¿Consultas sobre ES6, DOM o async/await?",
  "depurar": "Para depurar en Chrome: 1. Abre DevTools (F12) 2. Selecciona 'Sources' 3. Agrega breakpoints",
  "responsive": "Usa media queries: @media (max-width: 768px) { /* estilos */ }",
  "api": "Una API REST típica usa: GET (leer), POST (crear), PUT (actualizar), DELETE (eliminar)",
  "npm": "npm install <paquete> --save para dependencias de producción",
  "git": "Flujo básico: git add . → git commit -m 'mensaje' → git push",
  "error": "Describe tu error: ¿Qué esperabas? ¿Qué resultado obtienes? ¿Código relevante?",
  "default": "No entiendo tu pregunta. ¿Podrías reformularla o preguntar sobre:\n- HTML/CSS\n- JavaScript\n- Depuración\n- Responsive design\n- APIs\n- Git/NPM\n- Errores comunes"
};

function sendMessage() {
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if (!message) return;

  // Mostrar mensaje del usuario
  const messagesContainer = document.getElementById('chatMessages');
  messagesContainer.innerHTML += `
      <div class="message user">
          <strong>Tú:</strong> ${message}
      </div>
  `;

  // Generar respuesta
  let respuesta = conocimiento.default;
  const lowerMsg = message.toLowerCase();
  
  for (const [key, value] of Object.entries(conocimiento)) {
      if (lowerMsg.includes(key)) {
          respuesta = value;
          break;
      }
  }

  // Mostrar respuesta del bot
  setTimeout(() => {
      messagesContainer.innerHTML += `
          <div class="message bot">
              <strong>Bot:</strong> ${respuesta}
          </div>
      `;
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }, 500);

  input.value = '';
}
</script>
</body>
</html>
