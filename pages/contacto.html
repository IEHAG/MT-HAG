<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Media Técnica HAG</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    body { padding: 140px 40px 100px; background: transparent; }

    .page-header {
      text-align: center; margin-bottom: 36px; position: relative; z-index: 2;
    }
    .page-header h1 {
      font-size: 2rem; font-weight: 800; color: var(--primary);
      letter-spacing: -0.5px; margin-bottom: 6px;
    }
    .page-header p { color: var(--text-light); font-size: 0.95rem; }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      max-width: 1000px;
      margin: 0 auto;
      position: relative; z-index: 2;
    }

    /* Cards */
    .contact-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.04);
      overflow: hidden;
      transition: var(--transition);
    }
    .contact-card:hover { box-shadow: var(--shadow-lg); }

    .contact-card-header {
      padding: 22px 28px 0;
      display: flex; align-items: center; gap: 12px;
    }
    .contact-card-header .card-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .contact-card-header .card-icon.form-icon { background: linear-gradient(135deg, var(--secondary), #0052a3); }
    .contact-card-header .card-icon.info-icon { background: linear-gradient(135deg, var(--accent), #008833); }
    .contact-card-header h2 {
      font-size: 1.1rem; font-weight: 700; color: var(--primary);
    }

    .contact-card-body { padding: 20px 28px 28px; }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-group:last-of-type { margin-bottom: 20px; }

    .form-group label {
      display: block; font-size: 0.78rem; font-weight: 600;
      color: var(--text-light); text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 6px;
    }

    .form-input {
      width: 100%; padding: 12px 16px;
      background: rgba(0,0,0,0.02);
      border: 2px solid rgba(0,0,0,0.06);
      border-radius: var(--radius-sm);
      font-size: 0.9rem; font-family: var(--font);
      color: var(--text);
      transition: var(--transition);
      outline: none;
    }
    .form-input:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 4px rgba(0,102,204,0.1);
      background: var(--white);
    }
    .form-input::placeholder { color: rgba(0,0,0,0.2); }
    textarea.form-input { min-height: 120px; resize: vertical; }

    .submit-btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 12px 28px;
      background: linear-gradient(135deg, var(--secondary), #0052a3);
      color: #fff; border: none;
      border-radius: var(--radius-sm);
      font-weight: 600; font-size: 0.9rem; cursor: pointer;
      font-family: var(--font);
      transition: var(--transition);
    }
    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,102,204,0.35);
    }
    .submit-btn i { transition: transform 0.3s ease; }
    .submit-btn:hover i { transform: translateX(4px); }

    /* Info items */
    .info-item {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 14px 16px;
      background: rgba(0,0,0,0.02);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      transition: var(--transition);
    }
    .info-item:last-of-type { margin-bottom: 18px; }
    .info-item:hover { background: rgba(0,102,204,0.04); transform: translateX(4px); }

    .info-item .info-icon-box {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 1rem;
    }
    .info-item .info-icon-box.loc { background: rgba(220,20,60,0.1); color: var(--accent-red); }
    .info-item .info-icon-box.phone { background: rgba(0,170,68,0.1); color: var(--accent); }
    .info-item .info-icon-box.map { background: rgba(0,102,204,0.1); color: var(--secondary); }

    .info-item .info-text { font-size: 0.88rem; color: var(--text); line-height: 1.5; }
    .info-item .info-text strong { color: var(--primary); font-weight: 600; display: block; font-size: 0.82rem; margin-bottom: 2px; }
    .info-item a { color: var(--secondary); text-decoration: none; font-weight: 500; }
    .info-item a:hover { text-decoration: underline; }

    /* Map */
    .map-wrapper {
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
    }
    .map-wrapper iframe { display: block; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      .contact-card { background: rgba(255,255,255,0.04); }
      .contact-card:hover { border-color: rgba(0,102,204,0.2); }
      .contact-card-header h2 { color: var(--text); }
      .info-item { background: rgba(255,255,255,0.03); }
      .info-item:hover { background: rgba(255,255,255,0.06); }
      .form-input { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.08); color: var(--text); }
      .form-input:focus { background: rgba(255,255,255,0.06); border-color: var(--secondary); }
      .form-input::placeholder { color: rgba(255,255,255,0.15); }
    }

    @media (max-width: 860px) {
      .contact-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 780px) {
      body { padding: 120px 16px 80px; }
      .page-header h1 { font-size: 1.4rem; }
      .contact-card-body { padding: 16px 20px 24px; }
      .contact-card-header { padding: 18px 20px 0; }
    }

    @media (max-width: 480px) {
      body { padding: 110px 12px 80px; }
      .page-header h1 { font-size: 1.2rem; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <canvas id="galaxy-canvas" aria-hidden="true"></canvas>

  <div class="back-to-main">
    <a href="../index.html"><i class="fas fa-arrow-left"></i> Volver</a>
  </div>

  <div class="page-header">
    <h1><i class="fas fa-envelope" style="color:var(--accent-red);margin-right:10px;"></i>Contacto</h1>
    <p>Estamos para servirte</p>
  </div>

  <div class="contact-grid">
    <!-- Form -->
    <div class="contact-card" style="animation:fadeUp 0.4s ease both;">
      <div class="contact-card-header">
        <div class="card-icon form-icon"><i class="fas fa-paper-plane" style="color:#fff;font-size:1.1rem;"></i></div>
        <h2>Envíanos un mensaje</h2>
      </div>
      <div class="contact-card-body">
        <form id="contact-form">
          <div class="form-group">
            <label for="contact-name"><i class="fas fa-user" style="margin-right:4px;"></i> Nombre completo</label>
            <input type="text" id="contact-name" class="form-input" placeholder="Tu nombre" required>
          </div>
          <div class="form-group">
            <label for="contact-email"><i class="fas fa-at" style="margin-right:4px;"></i> Correo electrónico</label>
            <input type="email" id="contact-email" class="form-input" placeholder="correo@ejemplo.com" required>
          </div>
          <div class="form-group">
            <label for="contact-message"><i class="fas fa-comment-dots" style="margin-right:4px;"></i> Mensaje</label>
            <textarea id="contact-message" class="form-input" placeholder="Escribe tu mensaje aquí..." required></textarea>
          </div>
          <button type="submit" class="submit-btn">
            <span>Enviar Mensaje</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </form>
      </div>
    </div>

    <!-- Info -->
    <div class="contact-card" style="animation:fadeUp 0.4s ease 0.12s both;">
      <div class="contact-card-header">
        <div class="card-icon info-icon"><i class="fas fa-info" style="color:#fff;font-size:1.1rem;"></i></div>
        <h2>Información de Contacto</h2>
      </div>
      <div class="contact-card-body">
        <div class="info-item">
          <div class="info-icon-box loc"><i class="fas fa-location-dot"></i></div>
          <div class="info-text">
            <strong>Dirección</strong>
            Calle 50 No 39 - 65 Barrio Boston<br>
            Medellín - Colombia - Suramérica
          </div>
        </div>
        <div class="info-item">
          <div class="info-icon-box phone"><i class="fas fa-phone"></i></div>
          <div class="info-text">
            <strong>Teléfono</strong>
            216 12 58
          </div>
        </div>
        <div class="info-item">
          <div class="info-icon-box map"><i class="fas fa-map"></i></div>
          <div class="info-text">
            <strong>Cómo llegar</strong>
            <a href="https://www.google.com/maps/place/Instituci%C3%B3n+Educativa+H%C3%A9ctor+Abad+G%C3%B3mez/@6.245557,-75.56033,15z/data=!4m5!3m4!1s0x0:0x82ced4a19d499882!8m2!3d6.245557!4d-75.5603298?hl=es&shorturl=1" target="_blank">
              <i class="fas fa-external-link-alt"></i> Ver en Google Maps
            </a>
          </div>
        </div>

        <div class="map-wrapper">
          <iframe title="Ubicación I.E. Héctor Abad Gómez" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3976.815030797795!2d-75.562904!3d6.2455569!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e44284d5b3a8c21%3A0x82ced4a19d499882!2sInstituci%C3%B3n%20Educativa%20H%C3%A9ctor%20Abad%20G%C3%B3mez!5e0!3m2!1ses!2sco!4v1700000000000!5m2!1ses!2sco" width="100%" height="260" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <span>&copy; 2025 I.E. Héctor Abad Gómez</span>
      <span class="footer-sep">|</span>
      <span>Desarrollado por Docente Victor Cañola</span>
    </div>
  </footer>

  <script src="../js/contacto.js"></script>
  <script type="module" src="../src/js/galaxy.js"></script>
</body>
</html>
