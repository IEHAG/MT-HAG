<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material de Estudio - Media Técnica HAG</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        body { padding: 140px 40px 80px; }

        .back-to-main {
            position: fixed;
            top: 16px;
            left: 20px;
            z-index: 110;
        }

        .back-to-main a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            color: var(--white);
            font-weight: 500;
            font-size: 0.85rem;
            text-decoration: none;
            transition: var(--transition);
            font-family: var(--font);
        }

        .back-to-main a:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 2;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-light);
            font-size: 1rem;
        }

        .material-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .material-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.04);
            transition: var(--transition);
        }

        .material-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .material-card-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .material-card-header .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .material-card-header .card-icon.prog {
            background: linear-gradient(135deg, #003366, #004d99);
            color: #fff;
        }

        .material-card-header .card-icon.prep {
            background: linear-gradient(135deg, #00AA44, #00cc55);
            color: #fff;
        }

        .material-card-header h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.3;
        }

        .material-list { padding: 8px 0; }

        .material-teacher {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            border-bottom: 1px solid rgba(0,0,0,0.03);
            transition: var(--transition);
        }

        .material-teacher:last-child { border-bottom: none; }
        .material-teacher:hover { background: rgba(0,0,0,0.015); }

        .teacher-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .teacher-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .teacher-name {
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--primary);
        }

        .teacher-role {
            font-size: 0.75rem;
            color: var(--dark-gray, #64748b);
        }

        .teacher-actions {
            display: flex;
            gap: 8px;
        }

        .teacher-actions a {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }

        .teacher-actions .btn-drive {
            background: linear-gradient(135deg, #0066CC, #0052a3);
            color: #fff;
        }

        .teacher-actions .btn-drive:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,102,204,0.3);
        }

        .teacher-actions .btn-download {
            background: var(--light-gray, #f1f5f9);
            color: var(--primary);
        }

        .teacher-actions .btn-download:hover {
            background: var(--secondary);
            color: #fff;
            transform: translateY(-2px);
        }

        @media (max-width: 780px) {
            body { padding: 120px 16px 80px; }
            .page-header h1 { font-size: 1.4rem; }
            .material-grid { grid-template-columns: 1fr; }
            .material-teacher { flex-direction: column; gap: 12px; align-items: flex-start; }
            .teacher-actions { width: 100%; justify-content: flex-end; }
            .back-to-main { top: 10px; left: 10px; }
            .back-to-main a { padding: 8px 14px; font-size: 0.75rem; }
        }

        @media (max-width: 480px) {
            body { padding: 110px 12px 80px; }
            .page-header h1 { font-size: 1.2rem; }
            .teacher-actions a { padding: 6px 10px; font-size: 0.72rem; }
        }

        @media (prefers-color-scheme: dark) {
            .material-card { background: rgba(255,255,255,0.04); }
            .material-card:hover { border-color: rgba(0,102,204,0.2); }
            .material-teacher:hover { background: rgba(255,255,255,0.03); }
            .teacher-actions .btn-download { background: rgba(255,255,255,0.08); color: var(--text); }
            .teacher-name { color: var(--text); }
        }
    </style>
</head>
<body>
    <canvas id="galaxy-canvas" aria-hidden="true"></canvas>

    <div class="back-to-main">
        <a href="../index.html"><i class="fas fa-arrow-left"></i> Volver</a>
    </div>

    <div class="page-header">
        <h1><i class="fas fa-book-open" style="color:var(--accent-red);margin-right:10px;"></i>Material de Estudio</h1>
        <p>Recursos académicos por programa y grado</p>
    </div>

    <div class="material-grid" id="materials"></div>

    <footer>
        <div class="footer-content">
            <span>&copy; 2025 I.E. Héctor Abad Gómez</span>
            <span class="footer-sep">|</span>
            <span>Desarrollado por Docente Victor Cañola</span>
        </div>
    </footer>

    <script src="../js/material.js"></script>
    <script type="module" src="../src/js/galaxy.js"></script>
</body>
</html>
